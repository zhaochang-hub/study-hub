<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题本 · 101双榆树学习辅导</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #e8f0fe;
  --card: #fff;
  --text: #1a2744;
  --text-muted: #4a628a;
  --border: #c8d9f0;
  --accent: #3b82f6;
  --accent2: #6366f1;
  --accent-light: #dbeafe;
  --success: #059669;
  --danger: #ef4444;
  --warning: #f59e0b;
  --blue: #3b82f6;
  --font-sans: 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  --mono-font: 'JetBrains Mono', 'Consolas', monospace;
  --radius: 16px;
  --comic-shadow: 3px 3px 0 rgba(59,130,246,0.1);
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  background-image:
    radial-gradient(circle, rgba(59,130,246,0.06) 1px, transparent 1px),
    radial-gradient(circle, rgba(99,102,241,0.04) 1px, transparent 1px);
  background-size: 24px 24px, 32px 32px;
  background-position: 0 0, 12px 12px;
}

.container { max-width: 1000px; margin: 0 auto; padding: 16px 20px 40px; }

.header {
  background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 30%, #3b82f6 60%, #6366f1 100%);
  color: #fff;
  padding: 20px 0 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 4px solid #1a2744;
  box-shadow: 0 2px 12px rgba(59,130,246,0.15);
}
.header::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.header h1 {
  font-family: var(--font-sans);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.03em;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
}
.header .sub { font-size: 12px; opacity: 0.85; margin-top: 2px; letter-spacing: 1px; font-weight: 500; }
.header a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 12px; display: inline-block; margin-top: 4px; font-weight: 600; }
.header a:hover { color: #fff; }

.stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin: 20px 0 16px; }
.stat-card {
  flex: 1; min-width: 100px;
  background: #fff;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  padding: 14px 18px;
  box-shadow: var(--comic-shadow);
  text-align: center;
}
.stat-card .num { font-size: 30px; font-weight: 800; color: var(--accent); }
.stat-card .label { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-weight: 600; }
.stat-card.today { border-color: #ef4444; }
.stat-card.today .num { color: #ef4444; }
.stat-card.week { border-color: #6366f1; }
.stat-card.week .num { color: #6366f1; }

.section {
  background: #fff;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  box-shadow: var(--comic-shadow);
  padding: 20px;
  margin-bottom: 16px;
}
.section-title {
  font-family: var(--font-sans);
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .icon { font-size: 20px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }

.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label {
  font-size: 12px; font-weight: 700; color: var(--text-muted);
  letter-spacing: 0.02em;
}
.form-group input, .form-group select, .form-group textarea {
  padding: 8px 12px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-sans);
  background: #f8fafd;
  color: var(--text);
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}
.form-group textarea { resize: vertical; min-height: 60px; }

.btn {
  padding: 10px 20px;
  border: 2px solid transparent;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border-color: #1a2744;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}
.btn-primary:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 rgba(0,0,0,0.15); }
.btn-outline {
  background: var(--card);
  color: var(--accent);
  border: 2px solid var(--border);
}
.btn-outline:hover { background: var(--accent-light); border-color: var(--accent); }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 8px; }
.btn-danger { background: var(--danger); color: #fff; border-color: #dc2626; }
.btn-danger:hover { background: #dc2626; }
.btn-success { background: var(--success); color: #fff; border-color: #047857; }
.btn-success:hover { background: #047857; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.filter-bar {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px;
}
.filter-bar select, .filter-bar input {
  padding: 6px 10px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  background: #f8fafd;
  color: var(--text);
}
.filter-bar .count { font-size: 13px; color: var(--text-muted); margin-left: auto; font-weight: 600; }

/* OCR */
.ocr-row { display: flex; gap: 8px; align-items: stretch; }
.ocr-actions { display: flex; flex-direction: column; gap: 6px; min-width: 140px; }
.ocr-btn {
  padding: 8px 14px;
  border: 2px dashed var(--accent);
  border-radius: 10px;
  background: var(--accent-light);
  color: var(--accent);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-sans);
  font-weight: 700;
  white-space: nowrap;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.ocr-btn:hover { background: #bfdbfe; border-style: solid; }
.ocr-btn.loading { opacity: 0.6; pointer-events: none; }
.ocr-btn .spinner {
  display: none; width: 14px; height: 14px;
  border: 2px solid var(--accent); border-top-color: transparent;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
.ocr-btn.loading .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.ocr-paste-zone {
  border: 2px dashed var(--border);
  border-radius: 10px;
  padding: 8px;
  text-align: center;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  background: #f8fafd;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 40px;
  font-weight: 600;
}
.ocr-paste-zone:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.ocr-paste-zone.drag-over { border-color: var(--accent); background: var(--accent-light); border-style: solid; }
.ocr-progress { font-size: 11px; color: var(--text-muted); margin-top: 4px; min-height: 16px; }

/* Image preview in form */
.img-preview-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.img-preview {
  max-width: 200px; max-height: 150px; border-radius: 10px;
  border: 2px solid var(--border); object-fit: contain;
  background: #f0f4ff;
}
.img-preview-placeholder {
  width: 200px; height: 100px; border-radius: 10px;
  border: 2px dashed var(--border); display: flex;
  align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-muted);
}

/* Table */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  box-shadow: var(--comic-shadow);
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: linear-gradient(135deg, #1e3a5f, #3b82f6);
  padding: 10px 8px;
  text-align: left;
  font-weight: 700;
  font-size: 12px;
  color: #fff;
  white-space: nowrap;
  letter-spacing: 0.03em;
}
tbody td { padding: 8px; border-bottom: 1px solid #e8f0fe; vertical-align: top; }
tbody tr:hover { background: rgba(59,130,246,0.04); }
tbody tr:nth-child(even) td { background: rgba(59,130,246,0.02); }
tbody tr:hover:nth-child(even) td { background: rgba(59,130,246,0.06); }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid;
}
.badge-subject { background: #dbeafe; color: #1d4ed8; border-color: #93c5fd; }
.badge-error { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.badge-review-new { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
.badge-review-due { background: #fef3c7; color: #d97706; border-color: #fcd34d; }
.badge-review-done { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }

/* List thumbnails */
.list-thumb {
  width: 60px; height: 45px; object-fit: cover; border-radius: 8px;
  border: 2px solid var(--border); cursor: pointer; background: #f0f4ff;
  transition: transform 0.15s;
}
.list-thumb:hover { transform: scale(1.1); border-color: var(--accent); }
.no-thumb {
  width: 60px; height: 45px; border-radius: 8px;
  background: #f0f4ff; display: flex; align-items: center;
  justify-content: center; font-size: 18px; color: #c8d9f0;
  border: 2px solid var(--border);
}

/* Review alert */
.review-alert {
  background: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(239,68,68,0.04));
  border: 2px solid #fcd34d;
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--comic-shadow);
}
.review-alert .count-badge {
  background: #ef4444;
  color: #fff;
  border-radius: 50%;
  width: 30px; height: 30px;
  display: flex; align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 14px;
  border: 2px solid #dc2626;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}

.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
.empty-state .big { font-size: 48px; margin-bottom: 12px; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; justify-content: center; align-items: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff;
  border-radius: var(--radius);
  border: 2px solid var(--border);
  padding: 24px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 4px 4px 0 rgba(59,130,246,0.15), 0 8px 32px rgba(0,0,0,0.15);
}
.modal.wide { max-width: 800px; }
.modal h3 {
  font-family: var(--font-sans);
  margin-bottom: 16px;
  color: var(--text);
  font-weight: 800;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal h3::before { content: '▸'; color: var(--accent); }

/* Image viewer modal */
.img-viewer {
  max-width: 100%; max-height: 70vh; display: block; margin: 0 auto;
  border-radius: 12px; border: 2px solid var(--border);
  box-shadow: 3px 3px 0 rgba(59,130,246,0.1);
}

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #1e3a5f, #3b82f6);
  color: #fff;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  z-index: 300;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  border: 2px solid #1a2744;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.15);
}
.toast.show { opacity: 1; }

@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .stats-bar { flex-direction: column; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-bar .count { margin-left: 0; margin-top: 4px; }
  .ocr-row { flex-direction: column; }
  .ocr-actions { flex-direction: row; }
}
</style>

<script>
// ===== IndexedDB =====
const DB_NAME = 'errbook_101sy';
const DB_VERSION = 2;
const STORE = 'errors';
let _db = null;

function openDB() {
  return new Promise(function(resolve, reject) {
    if (_db) return resolve(_db);
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        var store = db.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('profileId', 'profileId', { unique: false });
      }
    };
    req.onsuccess = function(e) { _db = e.target.result; resolve(_db); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function getProfileId() { return getProfiles()[getCurrentProfile()].id; }

function getData() {
  return openDB().then(function(db) {
    return new Promise(function(resolve) {
      var tx = db.transaction(STORE, 'readonly');
      var store = tx.objectStore(STORE);
      var idx = store.index('profileId');
      var req = idx.getAll(getProfileId());
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = function() { resolve([]); };
    });
  });
}

function saveEntries(entries) {
  return openDB().then(function(db) {
    return new Promise(function(resolve) {
      var tx = db.transaction(STORE, 'readwrite');
      var store = tx.objectStore(STORE);
      entries.forEach(function(e) { store.put(e); });
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { resolve(); };
    });
  });
}

function addEntry(entry) {
  return openDB().then(function(db) {
    return new Promise(function(resolve) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).add(entry);
      tx.oncomplete = function() { resolve(); };
    });
  });
}

function updateEntry(entry) {
  return openDB().then(function(db) {
    return new Promise(function(resolve) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(entry);
      tx.oncomplete = function() { resolve(); };
    });
  });
}

function deleteEntry(id) {
  return openDB().then(function(db) {
    return new Promise(function(resolve) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = function() { resolve(); };
    });
  });
}

function clearProfile(profileId) {
  return getData().then(function(data) {
    return openDB().then(function(db) {
      return new Promise(function(resolve) {
        var tx = db.transaction(STORE, 'readwrite');
        var store = tx.objectStore(STORE);
        data.forEach(function(e) { store.delete(e.id); });
        tx.oncomplete = function() { resolve(); };
      });
    });
  });
}

// ===== Profile Management =====
const PROFILE_LIST_KEY = 'errbook_profiles';
const CURRENT_PROFILE_KEY = 'errbook_current';

function getProfiles() {
  try {
    var arr = JSON.parse(localStorage.getItem(PROFILE_LIST_KEY));
    if (Array.isArray(arr) && arr.length > 0) return arr;
  } catch(e) {}
  return [{ name: '孩子 1', id: 'p1' }];
}
function saveProfiles(arr) { localStorage.setItem(PROFILE_LIST_KEY, JSON.stringify(arr)); }
function getCurrentProfile() {
  var idx = parseInt(localStorage.getItem(CURRENT_PROFILE_KEY), 10);
  return isNaN(idx) ? 0 : idx;
}
function setCurrentProfile(idx) { localStorage.setItem(CURRENT_PROFILE_KEY, idx); }

// ===== Image Compression =====
function compressImage(file, maxW, quality) {
  maxW = maxW || 800;
  quality = quality || 0.6;
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxW) { h = h * (maxW / w); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ===== Utilities =====
var REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30];
var _pendingImage = null;
var _pendingAnswerImage = null;
var _voiceRecognition = null;
var _isVoiceActive = false;

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}
function genId() { return 'err_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
function formatDate(d) {
  if (!d) return '';
  var p = new Date(d + 'T00:00:00');
  return (p.getMonth() + 1) + '/' + p.getDate();
}
function getReviewStatus(item) {
  if (item.reviewStage == null) return 'new';
  if (item.reviewStage >= REVIEW_INTERVALS.length) return 'done';
  var lastDate = item.lastReviewDate || item.date;
  var nextDate = new Date(lastDate + 'T00:00:00');
  nextDate.setDate(nextDate.getDate() + REVIEW_INTERVALS[item.reviewStage]);
  var today = new Date(); today.setHours(0, 0, 0, 0);
  return nextDate <= today ? 'due' : 'pending';
}

// ===== Image Preview =====
function showImagePreview(dataUrl) {
  var container = document.getElementById('imgPreviewContainer');
  container.innerHTML = '<img class="img-preview" src="' + dataUrl + '" alt="题目截图预览" title="点击清除" onclick="clearImage()" style="cursor:pointer;">' +
    '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">点击图片可清除</div>';
  _pendingImage = dataUrl;
}
function clearImage() {
  _pendingImage = null;
  document.getElementById('imgPreviewContainer').innerHTML = '';
}

function showAnswerImagePreview(dataUrl) {
  var container = document.getElementById('answerImgPreview');
  container.innerHTML = '<img class="img-preview" src="' + dataUrl + '" alt="正确答案截图" title="点击清除" onclick="clearAnswerImage()" style="cursor:pointer;">' +
    '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;">点击图片可清除</div>';
  _pendingAnswerImage = dataUrl;
}
function clearAnswerImage() {
  _pendingAnswerImage = null;
  document.getElementById('answerImgPreview').innerHTML = '';
}

// ===== OCR =====
function runOCR(file) {
  var btn = document.getElementById('ocrBtn');
  var progress = document.getElementById('ocrProgress');
  btn.classList.add('loading');
  progress.textContent = '正在识别中，请稍候...';

  // Compress and store image for preview
  compressImage(file, 800, 0.6).then(function(dataUrl) {
    showImagePreview(dataUrl);
  });

  Tesseract.recognize(file, 'chi_sim+eng', {
    logger: function(m) {
      if (m.status === 'recognizing text') {
        progress.textContent = '识别中... ' + Math.round(m.progress * 100) + '%';
      }
    }
  }).then(function(result) {
    var text = result.data.text.trim();
    if (text) {
      var ta = document.getElementById('fQuestion');
      ta.value = (ta.value ? ta.value + '\n' : '') + text;
      showToast('识别完成！已填入题目描述');
    } else {
      showToast('未能识别到文字，请手动输入题目描述');
    }
    btn.classList.remove('loading');
    progress.textContent = '';
  }).catch(function(err) {
    showToast('识别失败：' + (err.message || '未知错误'));
    btn.classList.remove('loading');
    progress.textContent = '';
  });
}

function handleOCRImage(e) {
  var file = e.target.files[0];
  if (!file) return;
  runOCR(file);
  e.target.value = '';
}

// Ctrl+V paste
document.addEventListener('paste', function(e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      e.preventDefault();
      // Check if correct answer field is focused
      var activeEl = document.activeElement;
      if (activeEl && (activeEl.id === 'fCorrect' || activeEl.id === 'eCorrect')) {
        showToast('已粘贴正确答案截图');
        compressImage(items[i].getAsFile(), 800, 0.6).then(function(dataUrl) {
          showAnswerImagePreview(dataUrl);
        });
      } else {
        showToast('已粘贴截图，识别中...');
        runOCR(items[i].getAsFile());
      }
      return;
    }
  }
});

// Drag & drop
(function() {
  var zone = document.getElementById('pasteZone');
  if (!zone) return;
  zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', function() { zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', function(e) {
    e.preventDefault(); zone.classList.remove('drag-over');
    var file = e.dataTransfer.files[0];
    if (file && file.type.indexOf('image') !== -1) runOCR(file);
  });
})();

// ===== Voice Input =====
function toggleVoice() {
  if (_isVoiceActive) {
    stopVoice();
    return;
  }
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('您的浏览器不支持语音输入，请使用 Chrome 或 Edge');
    return;
  }
  _voiceRecognition = new SpeechRecognition();
  _voiceRecognition.lang = 'zh-CN';
  _voiceRecognition.interimResults = false;
  _voiceRecognition.continuous = false;
  _voiceRecognition.onresult = function(event) {
    var text = event.results[0][0].transcript;
    var ta = document.getElementById('fNotes');
    ta.value = (ta.value ? ta.value + ' ' : '') + text;
    document.getElementById('voiceStatus').style.display = 'none';
    document.getElementById('voiceBtn').innerHTML = '🎤 语音输入';
    document.getElementById('voiceBtn').style.background = '';
    _isVoiceActive = false;
    showToast('语音识别完成！');
  };
  _voiceRecognition.onerror = function(event) {
    document.getElementById('voiceStatus').style.display = 'none';
    document.getElementById('voiceBtn').innerHTML = '🎤 语音输入';
    document.getElementById('voiceBtn').style.background = '';
    _isVoiceActive = false;
    if (event.error === 'not-allowed') {
      showToast('请允许麦克风权限后重试');
    } else {
      showToast('语音识别失败，请重试');
    }
  };
  _voiceRecognition.onend = function() {
    document.getElementById('voiceStatus').style.display = 'none';
    document.getElementById('voiceBtn').innerHTML = '🎤 语音输入';
    document.getElementById('voiceBtn').style.background = '';
    _isVoiceActive = false;
  };
  _voiceRecognition.start();
  _isVoiceActive = true;
  document.getElementById('voiceStatus').style.display = 'block';
  document.getElementById('voiceBtn').innerHTML = '⏹ 停止';
  document.getElementById('voiceBtn').style.background = '#fee2e2';
}

function stopVoice() {
  if (_voiceRecognition) {
    _voiceRecognition.stop();
    _voiceRecognition = null;
  }
  _isVoiceActive = false;
  document.getElementById('voiceStatus').style.display = 'none';
  document.getElementById('voiceBtn').innerHTML = '🎤 语音输入';
  document.getElementById('voiceBtn').style.background = '';
}

// ===== CRUD =====
function addError() {
  var subject = document.getElementById('fSubject').value;
  var chapter = document.getElementById('fChapter').value.trim();
  var question = document.getElementById('fQuestion').value.trim();
  var wrong = document.getElementById('fWrong').value.trim();
  var correct = document.getElementById('fCorrect').value.trim();
  var errorType = document.getElementById('fErrorType').value;
  var date = document.getElementById('fDate').value;
  var notes = document.getElementById('fNotes').value.trim();

  if (!subject || !chapter) { showToast('请填写科目和章节'); return; }
  if (!question && !_pendingImage) { showToast('请填写题目描述或上传截图'); return; }

  var entry = {
    id: genId(),
    profileId: getProfileId(),
    subject: subject,
    chapter: chapter,
    question: question,
    wrongAnswer: wrong,
    correctAnswer: correct,
    answerImage: _pendingAnswerImage || null,
    errorType: errorType,
    date: date || new Date().toISOString().slice(0, 10),
    reviewStage: null,
    lastReviewDate: null,
    notes: notes,
    image: _pendingImage || null
  };

  addEntry(entry).then(function() {
    _pendingImage = null;
    _pendingAnswerImage = null;
    clearForm();
    refreshAll();
    var name = getProfiles()[getCurrentProfile()].name;
    showToast('「' + name + '」错题已保存！');
  });
}

function clearForm() {
  _pendingImage = null;
  _pendingAnswerImage = null;
  document.getElementById('fSubject').value = '';
  document.getElementById('fChapter').value = '';
  document.getElementById('fQuestion').value = '';
  document.getElementById('fWrong').value = '';
  document.getElementById('fCorrect').value = '';
  document.getElementById('fErrorType').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('imgPreviewContainer').innerHTML = '';
  document.getElementById('answerImgPreview').innerHTML = '';
  document.getElementById('ocrProgress').textContent = '';
}

function reviewError(id) {
  getData().then(function(data) {
    var item = data.find(function(e) { return e.id === id; });
    if (!item) return;
    if (item.reviewStage == null) { item.reviewStage = 0; }
    else { item.reviewStage = (item.reviewStage || 0) + 1; }
    item.lastReviewDate = new Date().toISOString().slice(0, 10);
    updateEntry(item).then(function() { refreshAll(); showToast('已标记复习！'); });
  });
}

function deleteError(id) {
  if (!confirm('确定删除这条错题吗？')) return;
  deleteEntry(id).then(function() { refreshAll(); showToast('已删除'); });
}

function confirmClearAll() {
  var name = getProfiles()[getCurrentProfile()].name;
  if (!confirm('确定清空「' + name + '」的所有错题记录吗？此操作不可恢复！建议先导出备份。')) return;
  clearProfile(getProfileId()).then(function() { refreshAll(); showToast('已清空「' + name + '」的错题'); });
}

// ===== Edit Modal =====
function editError(id) {
  getData().then(function(data) {
    var item = data.find(function(e) { return e.id === id; });
    if (!item) return;
    var overlay = document.getElementById('editModal');
    overlay.querySelector('.modal').innerHTML =
      '<h3>编辑错题</h3>' +
      '<div class="form-grid">' +
      '<div class="form-group"><label>科目</label><select id="eSubject">' +
        ['语文','数学','英语','物理','历史','地理','政治','生物'].map(function(s) {
          return '<option value="' + s + '"' + (item.subject === s ? ' selected' : '') + '>' + s + '</option>';
        }).join('') +
      '</select></div>' +
      '<div class="form-group"><label>章节/单元</label><input type="text" id="eChapter" value="' + (item.chapter || '') + '"></div>' +
      '<div class="form-group full"><label>题目描述</label><textarea id="eQuestion">' + (item.question || '') + '</textarea></div>' +
      (item.image ? '<div class="form-group full"><label>截图</label><img src="' + item.image + '" style="max-width:100%;max-height:200px;border-radius:6px;border:1px solid var(--border);"></div>' : '') +
      '<div class="form-group"><label>错误答案</label><input type="text" id="eWrong" value="' + (item.wrongAnswer || '') + '"></div>' +
      '<div class="form-group"><label>正确答案</label><input type="text" id="eCorrect" value="' + (item.correctAnswer || '') + '" placeholder="可粘贴截图">' +
      (item.answerImage ? '<div style="margin-top:4px;"><img src="' + item.answerImage + '" style="max-width:100%;max-height:200px;border-radius:6px;border:1px solid var(--border);"><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">正确答案截图</div></div>' : '') +
      '</div>' +
      '<div class="form-group"><label>错误类型</label><select id="eErrorType">' +
        ['计算错误','概念不清','审题失误','记忆不牢','粗心大意','其他'].map(function(et) {
          return '<option value="' + et + '"' + (item.errorType === et ? ' selected' : '') + '>' + et + '</option>';
        }).join('') +
      '</select></div>' +
      '<div class="form-group"><label>日期</label><input type="date" id="eDate" value="' + (item.date || '') + '"></div>' +
      '<div class="form-group full"><label>备注</label><textarea id="eNotes">' + (item.notes || '') + '</textarea></div>' +
      '</div>' +
      '<div class="btn-group" style="margin-top:16px;">' +
      '<button class="btn btn-primary" onclick="saveEdit(\'' + id + '\')">保存修改</button>' +
      '<button class="btn btn-outline" onclick="closeEdit()">取消</button>' +
      '</div>';
    overlay.classList.add('active');
  });
}

function saveEdit(id) {
  getData().then(function(data) {
    var item = data.find(function(e) { return e.id === id; });
    if (!item) return;
    item.subject = document.getElementById('eSubject').value;
    item.chapter = document.getElementById('eChapter').value.trim();
    item.question = document.getElementById('eQuestion').value.trim();
    item.wrongAnswer = document.getElementById('eWrong').value.trim();
    item.correctAnswer = document.getElementById('eCorrect').value.trim();
    if (_pendingAnswerImage) { item.answerImage = _pendingAnswerImage; _pendingAnswerImage = null; }
    item.errorType = document.getElementById('eErrorType').value;
    item.date = document.getElementById('eDate').value;
    item.notes = document.getElementById('eNotes').value.trim();
    updateEntry(item).then(function() {
      closeEdit();
      refreshAll();
      showToast('修改已保存！');
    });
  });
}

function closeEdit() { document.getElementById('editModal').classList.remove('active'); }
document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEdit(); });

// Image viewer
function viewImage(dataUrl) {
  document.getElementById('imageViewer').src = dataUrl;
  document.getElementById('imageModal').classList.add('active');
}
document.getElementById('imageModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('active');
});

// ===== Export / Import =====
function getAllEntries() {
  return openDB().then(function(db) {
    return new Promise(function(resolve) {
      var tx = db.transaction(STORE, 'readonly');
      var req = tx.objectStore(STORE).getAll();
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = function() { resolve([]); };
    });
  });
}

function exportData() {
  getData().then(function(data) {
    var name = getProfiles()[getCurrentProfile()].name;
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '_错题备份_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('「' + name + '」的备份已下载！');
  });
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error('格式错误');
      var profileId = getProfileId();
      imported.forEach(function(item) {
        if (!item.id) item.id = genId();
        item.profileId = profileId;
      });
      saveEntries(imported).then(function() {
        refreshAll();
        showToast('成功导入 ' + imported.length + ' 条错题！');
      });
    } catch(err) {
      showToast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===== Profile Management =====
function renderProfileTabs() {
  var profiles = getProfiles();
  var current = getCurrentProfile();
  var container = document.getElementById('profileTabs');
  container.innerHTML = profiles.map(function(p, i) {
    var active = i === current;
    return '<button onclick="switchProfile(' + i + ')" ondblclick="event.stopPropagation();renameProfile(' + i + ')" style="' +
      'background:' + (active ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.08)') + ';' +
      'border:1px solid ' + (active ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.15)') + ';' +
      'color:#f5e6d3;padding:4px 12px;border-radius:14px;cursor:pointer;font-size:12px;font-family:inherit;' +
      'font-weight:' + (active ? '600' : '400') + ';' +
      (profiles.length > 1 ? 'padding-right:6px;' : '') +
      '" title="单击切换，双击改名">' + p.name +
      (profiles.length > 1 ? '<span onclick="event.stopPropagation();deleteProfile(' + i + ')" style="margin-left:4px;opacity:0.5;font-size:10px;" title="删除">✕</span>' : '') +
      '</button>';
  }).join('');
}

function switchProfile(idx) {
  setCurrentProfile(idx);
  _pendingImage = null;
  clearForm();
  refreshAll();
}

function renameProfile(idx) {
  var profiles = getProfiles();
  var newName = prompt('改名：', profiles[idx].name);
  if (!newName || !newName.trim()) return;
  profiles[idx].name = newName.trim();
  saveProfiles(profiles);
  refreshAll();
  showToast('已改名为「' + newName.trim() + '」');
}

function addProfile() {
  var name = prompt('请输入孩子名字（或昵称）：', '孩子 ' + (getProfiles().length + 1));
  if (!name || !name.trim()) return;
  var profiles = getProfiles();
  profiles.push({ name: name.trim(), id: 'p' + Date.now() });
  saveProfiles(profiles);
  setCurrentProfile(profiles.length - 1);
  refreshAll();
  showToast('已添加「' + name.trim() + '」的错题本');
}

function deleteProfile(idx) {
  var profiles = getProfiles();
  if (profiles.length <= 1) { showToast('至少保留一个孩子'); return; }
  var name = profiles[idx].name;
  if (!confirm('确定删除「' + name + '」的错题本吗？所有数据会丢失！建议先导出备份。')) return;
  profiles.splice(idx, 1);
  saveProfiles(profiles);
  var current = getCurrentProfile();
  if (current >= profiles.length) setCurrentProfile(profiles.length - 1);
  refreshAll();
  showToast('已删除「' + name + '」');
}

// ===== Render =====
function updateStats() {
  getData().then(function(data) {
    var total = data.length;
    var due = data.filter(function(item) {
      var s = getReviewStatus(item);
      return s === 'due' || item.reviewStage == null;
    }).length;
    var weekStart = new Date(); weekStart.setDate(weekStart.getDate() - 7);
    var weekCount = data.filter(function(item) { return new Date(item.date) >= weekStart; }).length;
    document.getElementById('statsBar').innerHTML =
      '<div class="stat-card"><div class="num">' + total + '</div><div class="label">总错题数</div></div>' +
      '<div class="stat-card today"><div class="num">' + due + '</div><div class="label">今日待复习</div></div>' +
      '<div class="stat-card week"><div class="num">' + weekCount + '</div><div class="label">本周新增</div></div>';
  });
}

function updateReviewAlert() {
  getData().then(function(data) {
    var due = data.filter(function(item) {
      var s = getReviewStatus(item);
      return s === 'due' || item.reviewStage == null;
    }).length;
    var el = document.getElementById('reviewAlert');
    if (due > 0) {
      el.innerHTML = '<div class="review-alert"><div class="count-badge">' + due + '</div><div><strong>今日有 ' + due + ' 道错题需要复习</strong><br><span style="font-size:12px;color:#92400e;">艾宾浩斯记忆周期提醒</span></div></div>';
    } else { el.innerHTML = ''; }
  });
}

function populateFilters() {
  getData().then(function(data) {
    var subjects = [], errorTypes = [];
    data.forEach(function(item) {
      if (subjects.indexOf(item.subject) === -1) subjects.push(item.subject);
      if (errorTypes.indexOf(item.errorType) === -1) errorTypes.push(item.errorType);
    });
    var fSubject = document.getElementById('filterSubject');
    fSubject.innerHTML = '<option value="">全部科目</option>';
    subjects.forEach(function(s) { fSubject.innerHTML += '<option value="' + s + '">' + s + '</option>'; });
    var fErrorType = document.getElementById('filterErrorType');
    fErrorType.innerHTML = '<option value="">全部错误类型</option>';
    errorTypes.forEach(function(e) { fErrorType.innerHTML += '<option value="' + e + '">' + e + '</option>'; });
  });
}

function renderList() {
  getData().then(function(data) {
    var fSubject = document.getElementById('filterSubject').value;
    var fErrorType = document.getElementById('filterErrorType').value;
    var fReview = document.getElementById('filterReview').value;

    var filtered = data.filter(function(item) {
      if (fSubject && item.subject !== fSubject) return false;
      if (fErrorType && item.errorType !== fErrorType) return false;
      if (fReview === 'new') {
        var s = getReviewStatus(item);
        if (s !== 'due' && item.reviewStage != null) return false;
      }
      if (fReview === 'done') { if (getReviewStatus(item) !== 'done') return false; }
      return true;
    });

    filtered.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    document.getElementById('listCount').textContent = '共 ' + filtered.length + ' 条';

    var tbody = document.getElementById('listBody');
    var empty = document.getElementById('emptyState');

    if (filtered.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      tbody.innerHTML = filtered.map(function(item) {
        var status = getReviewStatus(item);
        var reviewHtml = '';
        if (status === 'due' || item.reviewStage == null) {
          reviewHtml = '<span class="badge badge-review-new">待复习</span>';
        } else if (status === 'done') {
          reviewHtml = '<span class="badge badge-review-done">已完成</span>';
        } else {
          var nextDate = new Date((item.lastReviewDate || item.date) + 'T00:00:00');
          nextDate.setDate(nextDate.getDate() + REVIEW_INTERVALS[item.reviewStage || 0]);
          reviewHtml = '<span class="badge badge-review-due">' + (nextDate.getMonth() + 1) + '/' + nextDate.getDate() + ' 复习</span>';
        }

        var thumbHtml = item.image
          ? '<img class="list-thumb" src="' + item.image + '" alt="截图" onclick="viewImage(\'' + item.image + '\')" title="点击查看大图">'
          : '<div class="no-thumb">📄</div>';

        return '<tr>' +
          '<td>' + thumbHtml + '</td>' +
          '<td><span class="badge badge-subject">' + (item.subject || '') + '</span></td>' +
          '<td>' + (item.chapter || '') + '</td>' +
          '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (item.question || '').replace(/"/g, '&quot;') + '">' + (item.question || '(仅截图)') + '</td>' +
          '<td style="color:#c0392b;">' + (item.wrongAnswer || '') + '</td>' +
          '<td style="color:#2d6a4f;">' + (item.correctAnswer || '') + (item.answerImage ? ' <img src="' + item.answerImage + '" style="max-width:60px;max-height:40px;border-radius:4px;border:1px solid var(--border);cursor:pointer;vertical-align:middle;" onclick="viewImage(\'' + item.answerImage + '\')" title="点击查看正确答案截图">' : '') + '</td>' +
          '<td><span class="badge badge-error">' + (item.errorType || '') + '</span></td>' +
          '<td>' + formatDate(item.date) + '</td>' +
          '<td>' + reviewHtml + '</td>' +
          '<td style="white-space:nowrap;">' +
            '<button class="btn btn-sm btn-outline" onclick="reviewError(\'' + item.id + '\')" title="标记已复习">✓</button> ' +
            '<button class="btn btn-sm btn-outline" onclick="editError(\'' + item.id + '\')">✎</button> ' +
            '<button class="btn btn-sm btn-outline" onclick="deleteError(\'' + item.id + '\')" style="color:#c0392b;">✕</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }
  });
}

function refreshAll() {
  renderProfileTabs();
  var name = getProfiles()[getCurrentProfile()].name;
  document.getElementById('profileLabel').textContent = '— ' + name;
  updateStats();
  updateReviewAlert();
  populateFilters();
  renderList();
}

// ===== Init =====
document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
refreshAll();
</script>
